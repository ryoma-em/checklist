<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="チェックリスト">
<title>毎日チェックリスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.app{padding:1.25rem 1rem 3rem;max-width:520px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.header h1{font-size:18px;font-weight:600;color:#1a1a1a}
.date-lbl{font-size:13px;color:#888}
.prog-wrap{background:#e0e0e0;border-radius:999px;height:6px;margin-bottom:.5rem;overflow:hidden}
.prog-bar{height:6px;border-radius:999px;background:#1D9E75;transition:width .3s}
.prog-txt{font-size:13px;color:#888;margin-bottom:1.25rem}
.sec{margin-bottom:1.25rem}
.sec-header{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.sec-title{font-size:11px;font-weight:600;color:#888;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:2px 4px;border-radius:4px}
.sec-title:hover{background:#ebebeb}
.sec-title-input{font-size:11px;font-weight:600;letter-spacing:.06em;border:none;border-bottom:1.5px solid #1D9E75;background:transparent;color:#888;outline:none;width:100px;padding:2px 4px}
.sec-del-btn{width:18px;height:18px;border:none;background:transparent;color:#aaa;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:3px;opacity:0}
.sec-header:hover .sec-del-btn{opacity:1}
.sec-del-btn:hover{background:#ebebeb;color:#555}
.item-wrap{margin-bottom:6px;border:1px solid #e8e8e8;border-radius:10px;background:#fff;overflow:hidden}
.item-row{display:flex;align-items:center;gap:10px;padding:12px 12px}
.item-row:hover{background:#fafafa}
.cb{width:22px;height:22px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cb.checked{background:#1D9E75;border-color:#1D9E75}
.cb.locked{opacity:.3;cursor:not-allowed}
.cb.clickable{cursor:pointer}
.cb svg{display:none;width:11px;height:11px}
.cb.checked svg{display:block}
.item-main{flex:1;min-width:0;cursor:pointer}
.item-name{font-size:15px;color:#1a1a1a;line-height:1.4}
.item-name.done{text-decoration:line-through;color:#aaa}
.sub-prog{font-size:11px;color:#aaa;margin-top:2px}
.badge-pri{font-size:11px;padding:2px 7px;border-radius:999px;background:#FFF3DC;color:#a06000;font-weight:600}
.expand-btn{width:24px;height:24px;border:none;background:transparent;color:#aaa;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0}
.expand-btn:hover{background:#f0f0f0}
.del-btn{width:24px;height:24px;border:none;background:transparent;color:#aaa;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px;opacity:0;flex-shrink:0}
.item-row:hover .del-btn{opacity:1}
.del-btn:hover{background:#f0f0f0;color:#555}
.item-detail{border-top:1px solid #f0f0f0;padding:10px 12px;display:none}
.item-detail.open{display:block}
.sub-list{margin-bottom:8px}
.sub-item{display:flex;align-items:center;gap:8px;padding:5px 2px}
.sub-cb{width:17px;height:17px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.sub-cb.checked{background:#1D9E75;border-color:#1D9E75}
.sub-cb svg{display:none;width:9px;height:9px}
.sub-cb.checked svg{display:block}
.sub-name{flex:1;font-size:13px;color:#1a1a1a}
.sub-name.done{text-decoration:line-through;color:#aaa}
.sub-del{width:18px;height:18px;border:none;background:transparent;color:#aaa;font-size:13px;cursor:pointer;opacity:0;border-radius:3px;display:flex;align-items:center;justify-content:center}
.sub-item:hover .sub-del{opacity:1}
.sub-del:hover{background:#f0f0f0}
.sub-add-row{display:flex;gap:6px;margin-top:4px}
.sub-add-input{flex:1;border:1px solid #e0e0e0;border-radius:7px;padding:6px 9px;font-size:13px;background:#fff;color:#1a1a1a;outline:none}
.sub-add-input:focus{border-color:#1D9E75}
.sub-add-btn{padding:6px 12px;border:1px solid #e0e0e0;border-radius:7px;background:#fff;color:#555;font-size:13px;cursor:pointer}
.sub-add-btn:hover{background:#f5f5f5}
.memo-row{margin-top:8px;border-top:1px solid #f0f0f0;padding-top:8px}
.memo-input{width:100%;border:1px solid #e0e0e0;border-radius:7px;padding:7px 9px;font-size:13px;background:#fff;color:#1a1a1a;resize:none;outline:none;font-family:inherit;line-height:1.5}
.memo-input:focus{border-color:#1D9E75}
.detail-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px;border-top:1px solid #f0f0f0;padding-top:8px}
.pri-toggle{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid #e0e0e0;background:transparent;color:#888;cursor:pointer}
.pri-toggle.on{background:#FFF3DC;color:#a06000;border-color:#f0c060}
.move-row{display:flex;align-items:center;gap:6px}
.move-label{font-size:12px;color:#888;white-space:nowrap}
.move-select{border:1px solid #e0e0e0;border-radius:7px;padding:4px 8px;font-size:12px;background:#fff;color:#1a1a1a;outline:none;cursor:pointer}
.move-btn{font-size:12px;padding:4px 11px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer}
.move-btn:hover{background:#f5f5f5}
.bottom-bar{margin-top:1.5rem;display:flex;flex-direction:column;gap:8px}
.add-item-row{display:flex;gap:8px}
.add-input{flex:1;border:1px solid #e0e0e0;border-radius:10px;padding:10px 13px;font-size:15px;background:#fff;color:#1a1a1a;outline:none}
.add-input:focus{border-color:#1D9E75}
.add-btn{padding:10px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;font-size:15px;cursor:pointer;white-space:nowrap}
.add-btn:hover{background:#f5f5f5}
.add-sec-row{display:flex;gap:8px}
.add-sec-input{flex:1;border:1px solid #e0e0e0;border-radius:10px;padding:10px 13px;font-size:15px;background:#fff;color:#1a1a1a;outline:none}
.add-sec-input:focus{border-color:#1D9E75}
.add-sec-btn{padding:10px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;font-size:15px;cursor:pointer;white-space:nowrap}
.add-sec-btn:hover{background:#f5f5f5}
.reset-btn{width:100%;padding:11px;border-radius:10px;border:1px solid #e0e0e0;background:transparent;color:#888;font-size:14px;cursor:pointer}
.reset-btn:hover{background:#f5f5f5;color:#555}
.all-done{text-align:center;padding:1rem;font-size:15px;color:#1D9E75;font-weight:600}
.all-done{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>毎日チェックリスト</h1>
    <span class="date-lbl" id="date-lbl"></span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="prog-txt" id="prog-txt">0 / 0 完了</div>
  <div id="sections-root"></div>
  <div class="all-done" id="all-done">すべて完了！お疲れさまでした</div>
  <div class="bottom-bar">
    <div class="add-item-row">
      <input class="add-input" id="add-input" placeholder="項目を追加..."/>
      <button class="add-btn" onclick="addItem()">追加</button>
    </div>
    <div class="add-sec-row">
      <input class="add-sec-input" id="add-sec-input" placeholder="セクション名を追加..."/>
      <button class="add-sec-btn" onclick="addSection()">+ セクション</button>
    </div>
    <button class="reset-btn" onclick="resetAll()">リセット（翌日用）</button>
  </div>
</div>

<svg style="display:none">
  <symbol id="ck" viewBox="0 0 11 11"><polyline points="1.5,5.5 4.5,8.5 9.5,2.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ck8" viewBox="0 0 9 9"><polyline points="1,4.5 3.5,7 8,2" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script>
const STORE_KEY='checklist_v6';
const DEFAULT_SECTIONS=[
  {label:'始業',items:[
    {text:'本日のタスク確認',priority:false,memo:'',subs:[],checked:false}
  ]},
  {label:'終業',items:[
    {text:'日報記入',priority:false,memo:'',subs:[],checked:false},
    {text:'メール送信',priority:false,memo:'',subs:[],checked:false}
  ]}
];

let sections=[];
let subState={};

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const p=JSON.parse(raw);sections=p.sections||[];subState=p.subState||{};return;}}catch(e){}
  sections=[];subState={};
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({sections,subState}));}catch(e){}}

function renderAll(){
  const root=document.getElementById('sections-root');
  root.innerHTML='';
  sections.forEach((sec,si)=>{
    const secDiv=document.createElement('div');
    secDiv.className='sec';
    const hdr=document.createElement('div');
    hdr.className='sec-header';
    const lbl=document.createElement('span');
    lbl.className='sec-title';
    lbl.id='sec-lbl-'+si;
    lbl.textContent=sec.label;
    lbl.title='クリックで名前を編集';
    lbl.onclick=()=>editSecLabel(si);
    const delBtn=document.createElement('button');
    delBtn.className='sec-del-btn';
    delBtn.title='セクションを削除';
    delBtn.textContent='×';
    delBtn.onclick=()=>deleteSection(si);
    hdr.appendChild(lbl);
    hdr.appendChild(delBtn);
    secDiv.appendChild(hdr);
    const list=document.createElement('div');
    list.id='list-'+si;
    secDiv.appendChild(list);
    root.appendChild(secDiv);
    sec.items.forEach((item,i)=>renderItem(list,si,i,item));
  });
  updateProgress();
}

function editSecLabel(si){
  const lbl=document.getElementById('sec-lbl-'+si);
  if(!lbl)return;
  const cur=sections[si].label;
  const inp=document.createElement('input');
  inp.className='sec-title-input';
  inp.value=cur;
  inp.onblur=()=>{const v=inp.value.trim();if(v){sections[si].label=v;save();}renderAll();};
  inp.onkeydown=(e)=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=cur;inp.blur();}};
  lbl.replaceWith(inp);
  inp.focus();inp.select();
}

function deleteSection(si){
  const keyPrefix=si+'-';
  Object.keys(subState).forEach(k=>{if(k.startsWith(keyPrefix))delete subState[k];});
  sections.splice(si,1);
  save();renderAll();
}

function addSection(){
  const inp=document.getElementById('add-sec-input');
  const text=inp.value.trim();
  if(!text)return;
  sections.push({label:text,items:[]});
  save();inp.value='';renderAll();
}

function buildMoveSelect(si,i,id){
  const row=document.createElement('div');
  row.className='move-row';
  const lbl=document.createElement('span');
  lbl.className='move-label';
  lbl.textContent='移動先:';
  const sel=document.createElement('select');
  sel.className='move-select';
  sel.id='move-sel-'+id;
  sections.forEach((sec,idx)=>{
    const opt=document.createElement('option');
    opt.value=idx;
    opt.textContent=sec.label;
    if(idx===si)opt.selected=true;
    sel.appendChild(opt);
  });
  const btn=document.createElement('button');
  btn.className='move-btn';
  btn.textContent='移動';
  btn.onclick=()=>moveItem(si,i,parseInt(sel.value));
  row.appendChild(lbl);
  row.appendChild(sel);
  row.appendChild(btn);
  return row;
}

function moveItem(fromSi,fromI,toSi){
  if(fromSi===toSi)return;
  const item=sections[fromSi].items.splice(fromI,1)[0];
  item.checked=false;
  const oldId=fromSi+'-'+fromI;
  const newI=sections[toSi].items.length;
  const newId=toSi+'-'+newI;
  const newSubState={};
  Object.keys(subState).forEach(k=>{
    if(k.startsWith(oldId+'-')){
      const suffix=k.slice(oldId.length);
      newSubState[newId+suffix]=subState[k];
    }else{
      newSubState[k]=subState[k];
    }
  });
  subState=newSubState;
  sections[toSi].items.push(item);
  save();renderAll();
}

function renderItem(container,si,i,item){
  const id=si+'-'+i;
  const subs=item.subs||[];
  const subsDone=subs.filter((_,idx)=>subState[id+'-'+idx]).length;
  const hasLock=subs.length>0;
  const wrap=document.createElement('div');
  wrap.className='item-wrap';
  wrap.id='wrap-'+id;
  wrap.innerHTML=`
    <div class="item-row" id="row-${id}">
      <div class="cb ${item.checked?'checked':''} ${hasLock?'locked':'clickable'}" id="cb-${id}">
        <svg><use href="#ck"/></svg>
      </div>
      <div class="item-main" onclick="toggleDetail('${id}')">
        <div class="item-name ${item.checked?'done':''}" id="name-${id}">${item.text}</div>
        ${subs.length>0?`<div class="sub-prog" id="sp-${id}">${subsDone}/${subs.length} サブ完了</div>`:''}
      </div>
      <div class="item-badges" id="badges-${id}">${item.priority?'<span class="badge-pri">!</span>':''}</div>
      <button class="expand-btn" onclick="toggleDetail('${id}')">▾</button>
      <button class="del-btn" onclick="deleteItem(${si},${i});event.stopPropagation()">×</button>
    </div>
    <div class="item-detail" id="detail-${id}">
      <div class="sub-list" id="subs-${id}"></div>
      <div class="sub-add-row">
        <input class="sub-add-input" id="sub-input-${id}" placeholder="サブ項目を追加..." onkeydown="if(event.key==='Enter')addSub(${si},${i},'${id}')"/>
        <button class="sub-add-btn" onclick="addSub(${si},${i},'${id}')">追加</button>
      </div>
      <div class="memo-row">
        <textarea class="memo-input" rows="2" placeholder="メモ（ミスの記録など）..." onchange="saveMemo(${si},${i},this.value)">${item.memo||''}</textarea>
      </div>
      <div class="detail-actions" id="detail-actions-${id}"></div>
    </div>`;
  container.appendChild(wrap);
  if(!hasLock){
    document.getElementById('cb-'+id).onclick=(e)=>{e.stopPropagation();toggleItem(si,i);};
  }
  const actionsRow=document.getElementById('detail-actions-'+id);
  const priBtn=document.createElement('button');
  priBtn.className='pri-toggle'+(item.priority?' on':'');
  priBtn.id='pri-'+id;
  priBtn.textContent='! 優先度マーク';
  priBtn.onclick=()=>togglePriority(si,i,id);
  actionsRow.appendChild(priBtn);
  if(sections.length>1)actionsRow.appendChild(buildMoveSelect(si,i,id));
  renderSubs(si,i,id,subs);
}

function renderSubs(si,i,id,subs){
  const container=document.getElementById('subs-'+id);
  if(!container)return;
  container.innerHTML='';
  subs.forEach((sub,idx)=>{
    const sid=id+'-'+idx;
    const checked=!!subState[sid];
    const div=document.createElement('div');
    div.className='sub-item';
    div.innerHTML=`
      <div class="sub-cb ${checked?'checked':''}" id="scb-${sid}" onclick="toggleSub(${si},${i},${idx},'${id}')"><svg><use href="#ck8"/></svg></div>
      <span class="sub-name ${checked?'done':''}" id="sn-${sid}">${sub}</span>
      <button class="sub-del" onclick="deleteSub(${si},${i},${idx},'${id}')">×</button>`;
    container.appendChild(div);
  });
}

function toggleDetail(id){document.getElementById('detail-'+id).classList.toggle('open');}

function toggleItem(si,i){
  const item=sections[si].items[i];
  item.checked=!item.checked;save();
  const id=si+'-'+i;
  document.getElementById('cb-'+id).classList.toggle('checked',item.checked);
  document.getElementById('name-'+id).classList.toggle('done',item.checked);
  updateProgress();
}

function updateMainCb(si,i,id){
  const item=sections[si].items[i];
  const subs=item.subs||[];
  const cb=document.getElementById('cb-'+id);
  if(!cb)return;
  if(subs.length===0){
    cb.classList.remove('locked');cb.classList.add('clickable');
    cb.onclick=(e)=>{e.stopPropagation();toggleItem(si,i);};return;
  }
  cb.classList.remove('clickable');cb.classList.add('locked');
  cb.onclick=(e)=>e.stopPropagation();
  const allDone=subs.every((_,idx)=>!!subState[id+'-'+idx]);
  item.checked=allDone;save();
  cb.classList.toggle('checked',allDone);
  const nameEl=document.getElementById('name-'+id);
  if(nameEl)nameEl.classList.toggle('done',allDone);
  updateProgress();
}

function toggleSub(si,i,idx,id){
  const sid=id+'-'+idx;
  subState[sid]=!subState[sid];save();
  document.getElementById('scb-'+sid).classList.toggle('checked',subState[sid]);
  document.getElementById('sn-'+sid).classList.toggle('done',subState[sid]);
  const subs=sections[si].items[i].subs||[];
  const done=subs.filter((_,k)=>subState[id+'-'+k]).length;
  const sp=document.getElementById('sp-'+id);
  if(sp)sp.textContent=done+'/'+subs.length+' サブ完了';
  updateMainCb(si,i,id);
}

function togglePriority(si,i,id){
  const item=sections[si].items[i];
  item.priority=!item.priority;save();
  document.getElementById('pri-'+id).classList.toggle('on',item.priority);
  const badges=document.getElementById('badges-'+id);
  if(badges)badges.innerHTML=item.priority?'<span class="badge-pri">!</span>':'';
}

function saveMemo(si,i,val){sections[si].items[i].memo=val;save();}

function addSub(si,i,id){
  const input=document.getElementById('sub-input-'+id);
  const text=input.value.trim();if(!text)return;
  const item=sections[si].items[i];
  if(!item.subs)item.subs=[];
  item.subs.push(text);save();input.value='';
  renderSubs(si,i,id,item.subs);
  const done=item.subs.filter((_,k)=>subState[id+'-'+k]).length;
  let sp=document.getElementById('sp-'+id);
  if(!sp){sp=document.createElement('div');sp.className='sub-prog';sp.id='sp-'+id;document.getElementById('name-'+id).after(sp);}
  sp.textContent=done+'/'+item.subs.length+' サブ完了';
  updateMainCb(si,i,id);
}

function deleteSub(si,i,idx,id){
  const item=sections[si].items[i];
  item.subs.splice(idx,1);
  const newSS={};
  Object.keys(subState).forEach(k=>{
    if(!k.startsWith(id+'-')){newSS[k]=subState[k];return;}
    const n=parseInt(k.split(id+'-')[1]);
    if(n<idx)newSS[k]=subState[k];
    else if(n>idx)newSS[id+'-'+(n-1)]=subState[k];
  });
  subState=newSS;save();
  renderSubs(si,i,id,item.subs);
  const sp=document.getElementById('sp-'+id);
  if(sp){if(item.subs.length===0)sp.remove();else{const d=item.subs.filter((_,k)=>subState[id+'-'+k]).length;sp.textContent=d+'/'+item.subs.length+' サブ完了';}}
  updateMainCb(si,i,id);
}

function deleteItem(si,i){
  const id=si+'-'+i;
  Object.keys(subState).forEach(k=>{if(k.startsWith(id+'-'))delete subState[k];});
  sections[si].items.splice(i,1);save();renderAll();
}

function addItem(){
  const input=document.getElementById('add-input');
  const text=input.value.trim();if(!text)return;
  if(sections.length===0)return;
  sections[sections.length-1].items.push({text,priority:false,memo:'',subs:[],checked:false});
  save();input.value='';renderAll();
}

function resetAll(){
  sections.forEach(sec=>sec.items.forEach(item=>{item.checked=false;item.memo='';}));
  subState={};save();renderAll();
}

function updateProgress(){
  let total=0,done=0;
  sections.forEach(sec=>sec.items.forEach(item=>{total++;if(item.checked)done++;}));
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=done+' / '+total+' 完了';
  document.getElementById('all-done').style.display=(done===total&&total>0)?'block':'none';
}

document.getElementById('date-lbl').textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
document.getElementById('add-input').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});
document.getElementById('add-sec-input').addEventListener('keydown',e=>{if(e.key==='Enter')addSection();});

load();
if(!sections||sections.length===0)sections=JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
renderAll();
</script>
</body>
</html>
